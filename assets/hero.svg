<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="armory — global, cross-session TODO for pi">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a09"/>
      <stop offset="0.5" stop-color="#0c1117"/>
      <stop offset="1" stop-color="#0a0e0c"/>
    </linearGradient>
    <!-- accent gradient (emerald → cyan) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0e7c6a"/>
    </linearGradient>
    <!-- soft glows -->
    <radialGradient id="glowA" cx="0.84" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#1f6f5c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1f6f5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.10" cy="0.92" r="0.45">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <!-- dot grid -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#172220" fill-opacity="0.5"/>
    </pattern>
    <!-- panel shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.5"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- logo mark gradient stroke -->
    <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- background layers -->
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#dots)" opacity="0.55"/>
  <rect width="1600" height="440" fill="url(#glowA)"/>
  <rect width="1600" height="440" fill="url(#glowB)"/>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1600" height="3" fill="url(#accent)"/>
  <!-- bottom subtle divider -->
  <rect x="0" y="437" width="1600" height="3" fill="#14201c" opacity="0.9"/>

  <!-- ================= LEFT: logo + wordmark ================= -->
  <g transform="translate(88, 84)">
    <!-- logo mark: rounded "vault" with 3 persistent slots, top one active -->
    <g transform="translate(0, 6)">
      <rect x="0" y="0" rx="16" ry="16" width="72" height="72" fill="#0e1714" stroke="url(#markStroke)" stroke-width="2.5"/>
      <!-- slot 1 (active/checked) -->
      <rect x="16" y="16" width="40" height="8" rx="4" fill="#34d399"/>
      <polyline points="20,20 27,26 38,16" fill="none" stroke="#0a0e0c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- slot 2 -->
      <rect x="16" y="34" width="40" height="6" rx="3" fill="#2a3833"/>
      <!-- slot 3 -->
      <rect x="16" y="48" width="28" height="6" rx="3" fill="#2a3833"/>
      <!-- persistent link node -->
      <circle cx="64" cy="58" r="5" fill="#0e1714" stroke="#22d3ee" stroke-width="1.6"/>
    </g>

    <!-- wordmark -->
    <text x="92" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="800" fill="#eef5f1" letter-spacing="-2.5">armory<tspan fill="#34d399">.</tspan></text>
    <rect x="94" y="76" width="196" height="5" rx="2.5" fill="url(#accent)" opacity="0.95"/>

    <!-- tagline -->
    <text x="92" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#cdd6d1">global, cross-session TODO for pi</text>
    <text x="92" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" fill="#7c8a84">persists across all sessions · auto-injected into every prompt</text>

    <!-- chips row -->
    <g transform="translate(92, 168)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
      <g>
        <rect x="0" y="0" rx="13" ry="13" width="118" height="26" fill="#10161a" stroke="#1f2a26" stroke-width="1"/>
        <circle cx="15" cy="13" r="4" fill="#34d399"/>
        <text x="27" y="17.5" fill="#9aa7a1" letter-spacing="0.5">pi extension</text>
      </g>
      <g transform="translate(130, 0)">
        <rect x="0" y="0" rx="13" ry="13" width="92" height="26" fill="#10161a" stroke="#1f2a26" stroke-width="1"/>
        <text x="46" y="17.5" fill="#9aa7a1" text-anchor="middle" letter-spacing="0.5">MIT</text>
      </g>
      <g transform="translate(232, 0)">
        <rect x="0" y="0" rx="13" ry="13" width="96" height="26" fill="#10161a" stroke="#1f2a26" stroke-width="1"/>
        <text x="48" y="17.5" fill="#9aa7a1" text-anchor="middle" letter-spacing="0.5">v0.1.0</text>
      </g>
      <g transform="translate(336, 0)">
        <rect x="0" y="0" rx="13" ry="13" width="168" height="26" fill="#10161a" stroke="#1f2a26" stroke-width="1"/>
        <text x="84" y="17.5" fill="#9aa7a1" text-anchor="middle" letter-spacing="0.5">no dependencies</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: live "Open TODOs" preview card ================= -->
  <g transform="translate(900, 60)">
    <!-- panel shadow base -->
    <rect x="0" y="6" rx="18" ry="18" width="612" height="320" fill="#000000" opacity="0.35" filter="url(#shadow)"/>
    <!-- panel -->
    <rect x="0" y="0" rx="18" ry="18" width="612" height="320" fill="#0b1110" stroke="#222e2a" stroke-width="1.2"/>
    <!-- titlebar -->
    <g transform="translate(20, 22)">
      <circle cx="7" cy="7" r="5" fill="#2a3833"/>
      <circle cx="24" cy="7" r="5" fill="#2a3833"/>
      <circle cx="41" cy="7" r="5" fill="#2a3833"/>
      <text x="566" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#6b7872" text-anchor="end">system prompt · injected each turn</text>
    </g>
    <line x1="20" y1="46" x2="592" y2="46" stroke="#1a2421" stroke-width="1"/>

    <!-- injected block content -->
    <g transform="translate(28, 68)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <!-- heading -->
      <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5" font-weight="700" fill="#34d399">## Open TODOs (3)</text>

      <!-- row 1: high, in_progress -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" rx="6" ry="6" width="40" height="20" fill="#3a2a0e" stroke="#fbbf24" stroke-width="1"/>
        <text x="20" y="14.5" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.4">high</text>
        <text x="52" y="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5f6b66">[td-…m6pjxhj]</text>
        <text x="184" y="14.5" font-size="13" fill="#e8efea">⏵ Decouple global rules → AGENTS.md</text>
        <rect x="408" y="2" rx="8" ry="8" width="44" height="16" fill="#10161a" stroke="#26312d"/>
        <text x="430" y="13.5" font-size="10.5" fill="#7c8a84" text-anchor="middle">(pi)</text>
      </g>

      <!-- row 2: med -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" rx="6" ry="6" width="34" height="20" fill="#0e1f33" stroke="#60a5fa" stroke-width="1"/>
        <text x="17" y="14.5" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0.4">med</text>
        <text x="46" y="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5f6b66">[td-…mzr0qs9]</text>
        <text x="178" y="14.5" font-size="13" fill="#e8efea">Research browser-use vs Chrome MCP</text>
      </g>

      <!-- row 3: low -->
      <g transform="translate(0, 116)">
        <rect x="0" y="0" rx="6" ry="6" width="32" height="20" fill="#1a1f24" stroke="#9ca3af" stroke-width="1"/>
        <text x="16" y="14.5" font-size="11" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="0.4">low</text>
        <text x="44" y="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5f6b66">[td-…nke3etn]</text>
        <text x="176" y="14.5" font-size="13" fill="#e8efea">.claude/ path normalization (skills)</text>
      </g>

      <!-- footer hint -->
      <text x="0" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4f5b56">… +3 more · use <tspan fill="#34d399">todo list</tspan> to see all</text>
    </g>
  </g>
</svg>